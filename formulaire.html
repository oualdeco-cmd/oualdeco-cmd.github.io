<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nouvelle facture</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body {
      background: #f5f6f8;
    }

    .navbar-brand {
      font-weight: 600;
    }

    .form-card {
      border: 0;
      border-radius: 12px;
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 15px;
    }

    .prestation {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .total-box {
      font-size: 1.4rem;
      font-weight: 700;
    }

  </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-primary shadow-sm">

  <div class="container-fluid">

    <button
      class="btn btn-link text-white text-decoration-none"
      onclick="retourAccueil()"
    >
      ←
    </button>

    <span class="navbar-brand mb-0">
      🧾 Nouvelle facture
    </span>

    <div style="width:40px"></div>

  </div>

</nav>



<!-- =====================================================
     CONTENU
===================================================== -->

<main class="container py-4">

  <div class="row justify-content-center">

    <div class="col-12 col-lg-9">


      <!-- =================================================
           INFORMATIONS FACTURE
      ================================================== -->

      <div class="card form-card shadow-sm mb-3">

        <div class="card-body">

          <h5 class="section-title">
            📄 Informations de la facture
          </h5>


          <div class="row g-3">

            <div class="col-12 col-md-6">

              <label class="form-label">
                Numéro de facture
              </label>

              <input
                type="text"
                id="numero"
                class="form-control"
                readonly
                placeholder="Génération..."
              >

            </div>


            <div class="col-12 col-md-6">

              <label class="form-label">
                Date
              </label>

              <input
                type="date"
                id="date"
                class="form-control"
              >

            </div>

          </div>

        </div>

      </div>



      <!-- =================================================
           CLIENT
      ================================================== -->

      <div class="card form-card shadow-sm mb-3">

        <div class="card-body">

          <h5 class="section-title">
            👤 Informations client
          </h5>


          <div class="row g-3">


            <div class="col-12">

              <label class="form-label">
                Nom du client *
              </label>

              <input
                type="text"
                id="client"
                class="form-control"
                placeholder="Nom du client"
              >

            </div>


            <div class="col-12">

              <label class="form-label">
                Adresse
              </label>

              <input
                type="text"
                id="adresse"
                class="form-control"
                placeholder="Adresse du client"
              >

            </div>


            <div class="col-12 col-md-6">

              <label class="form-label">
                Contact *
              </label>

              <input
                type="tel"
                id="contact"
                class="form-control"
                placeholder="Téléphone"
              >

            </div>


            <div class="col-12 col-md-6">

              <label class="form-label">
                Mode de paiement *
              </label>

              <select
                id="modePaiement"
                class="form-select"
              >

                <option value="">
                  Sélectionner
                </option>

                <option value="Espèces">
                  Espèces
                </option>

                <option value="Mobile Money">
                  Mobile Money
                </option>

                <option value="Virement">
                  Virement
                </option>

                <option value="Chèque">
                  Chèque
                </option>

                <option value="Carte bancaire">
                  Carte bancaire
                </option>

              </select>

            </div>

          </div>

        </div>

      </div>



      <!-- =================================================
           PRESTATIONS
      ================================================== -->

      <div class="card form-card shadow-sm mb-3">

        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="section-title mb-0">
              🛠️ Prestations
            </h5>

            <button
              type="button"
              class="btn btn-outline-primary btn-sm"
              onclick="ajouterPrestation()"
            >
              + Ajouter
            </button>

          </div>


          <div id="prestations"></div>


          <div class="text-end mt-4">

            <div class="text-muted">
              Total
            </div>

            <div
              id="total"
              class="total-box"
            >
              0 Ar
            </div>

          </div>

        </div>

      </div>



      <!-- =================================================
           MESSAGE
      ================================================== -->

      <div
        id="message"
        class="alert d-none"
      ></div>



      <!-- =================================================
           BOUTONS
      ================================================== -->

      <div class="d-grid gap-2 d-md-flex justify-content-md-end mb-5">

        <button
          type="button"
          class="btn btn-outline-secondary"
          onclick="retourAccueil()"
        >
          Annuler
        </button>

        <button
          type="button"
          id="btnEnregistrer"
          class="btn btn-primary"
          onclick="enregistrerFacture()"
        >
          💾 Enregistrer la facture
        </button>

      </div>


    </div>

  </div>

</main>



<script>

  // =====================================================
  // URL APPS SCRIPT
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwt6v8LytyBwJx5B8bZRJ9nUkhHt_hj_wv_UmQwSWHdTpPn8ayRLcj4qq8dJZJbSePx/exec";


  // =====================================================
  // RETOUR ACCUEIL
  // =====================================================

  function retourAccueil() {

    window.location.href =
      "index.html";

  }


  // =====================================================
  // DATE DU JOUR
  // =====================================================

  function mettreDateDuJour() {

    const aujourdHui =
      new Date();

    const annee =
      aujourdHui.getFullYear();

    const mois =
      String(
        aujourdHui.getMonth() + 1
      ).padStart(2, "0");

    const jour =
      String(
        aujourdHui.getDate()
      ).padStart(2, "0");

    document.getElementById("date").value =
      annee + "-" + mois + "-" + jour;

  }


  // =====================================================
  // AJOUTER UNE PRESTATION
  // =====================================================

  function ajouterPrestation(
    description = "",
    quantite = 1,
    pu = 0
  ) {

    const conteneur =
      document.getElementById(
        "prestations"
      );


    const bloc =
      document.createElement("div");

    bloc.className =
      "prestation";


    bloc.innerHTML = `

      <div class="row g-2 align-items-end">

        <div class="col-12 col-md-6">

          <label class="form-label">
            Description
          </label>

          <input
            type="text"
            class="form-control description"
            value="${description}"
            placeholder="Ex : Installation"
          >

        </div>


        <div class="col-6 col-md-2">

          <label class="form-label">
            Quantité
          </label>

          <input
            type="number"
            min="0"
            step="1"
            class="form-control quantite"
            value="${quantite}"
            oninput="calculerTotal()"
          >

        </div>


        <div class="col-6 col-md-3">

          <label class="form-label">
            Prix unitaire
          </label>

          <input
            type="number"
            min="0"
            step="1"
            class="form-control pu"
            value="${pu}"
            oninput="calculerTotal()"
          >

        </div>


        <div class="col-12 col-md-1">

          <button
            type="button"
            class="btn btn-outline-danger w-100"
            onclick="supprimerPrestation(this)"
          >
            ×
          </button>

        </div>

      </div>

    `;


    conteneur.appendChild(bloc);

    calculerTotal();

  }


  // =====================================================
  // SUPPRIMER PRESTATION
  // =====================================================

  function supprimerPrestation(
    bouton
  ) {

    bouton
      .closest(".prestation")
      .remove();

    calculerTotal();

  }


  // =====================================================
  // CALCUL TOTAL
  // =====================================================

  function calculerTotal() {

    let total = 0;


    document
      .querySelectorAll(".prestation")
      .forEach(function(bloc) {

        const quantite =
          Number(
            bloc.querySelector(
              ".quantite"
            ).value
          ) || 0;


        const pu =
          Number(
            bloc.querySelector(
              ".pu"
            ).value
          ) || 0;


        total +=
          quantite * pu;

      });


    document.getElementById("total")
      .textContent =
        total.toLocaleString("fr-FR") +
        " Ar";

  }


  // =====================================================
  // RÉCUPÉRER LES PRESTATIONS
  // =====================================================

  function recupererPrestations() {

    const resultat = [];


    document
      .querySelectorAll(".prestation")
      .forEach(function(bloc) {

        const description =
          bloc.querySelector(
            ".description"
          ).value.trim();


        const quantite =
          bloc.querySelector(
            ".quantite"
          ).value;


        const pu =
          bloc.querySelector(
            ".pu"
          ).value;


        if (description) {

          resultat.push({

            description:
              description,

            quantite:
              quantite,

            pu:
              pu

          });

        }

      });


    return resultat;

  }


  // =====================================================
  // ENREGISTRER
  // =====================================================

  async function enregistrerFacture() {

    const bouton =
      document.getElementById(
        "btnEnregistrer"
      );


    const message =
      document.getElementById(
        "message"
      );


    const donnees = {

      numero:
        document.getElementById(
          "numero"
        ).value,

      date:
        document.getElementById(
          "date"
        ).value,

      client:
        document.getElementById(
          "client"
        ).value.trim(),

      adresse:
        document.getElementById(
          "adresse"
        ).value.trim(),

      contact:
        document.getElementById(
          "contact"
        ).value.trim(),

      modePaiement:
        document.getElementById(
          "modePaiement"
        ).value,

      prestations:
        recupererPrestations()

    };


    // Vérifications

    if (!donnees.client) {

      afficherMessage(
        "Veuillez saisir le nom du client.",
        "danger"
      );

      return;

    }


    if (!donnees.contact) {

      afficherMessage(
        "Veuillez saisir le contact du client.",
        "danger"
      );

      return;

    }


    if (!donnees.modePaiement) {

      afficherMessage(
        "Veuillez sélectionner le mode de paiement.",
        "danger"
      );

      return;

    }


    if (!donnees.prestations.length) {

      afficherMessage(
        "Veuillez ajouter au moins une prestation.",
        "danger"
      );

      return;

    }


    bouton.disabled = true;

    bouton.textContent =
      "⏳ Enregistrement...";


    try {

     await fetch(
  API_URL,
  {
    method: "POST",

    mode: "no-cors",

    headers: {
      "Content-Type":
        "text/plain;charset=utf-8"
    },

    body:
      JSON.stringify({
        action:
          "enregistrerFacture",

        facture:
          donnees
      })
  }
);


      afficherMessage(
        "✅ Facture enregistrée avec succès.",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "index.html";

        },
        1500
      );


    } catch (erreur) {

      console.error(erreur);

      afficherMessage(
        "❌ " + erreur.message,
        "danger"
      );


      bouton.disabled = false;

      bouton.textContent =
        "💾 Enregistrer la facture";

    }

  }


  // =====================================================
  // MESSAGE
  // =====================================================

  function afficherMessage(
    texte,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.className =
      "alert alert-" +
      type;


    message.textContent =
      texte;


    message.classList.remove(
      "d-none"
    );

  }


  // =====================================================
  // INITIALISATION
  // =====================================================

async function obtenirNumeroFacture() {

  const champNumero =
    document.getElementById("numero");

  try {

    const response = await fetch(
      API_URL + "?page=nouvelleFacture"
    );

    const resultat =
      await response.json();

    if (!resultat.succes) {

      throw new Error(
        resultat.erreur ||
        "Impossible de générer le numéro."
      );

    }

    champNumero.value =
      resultat.numero;

  } catch (erreur) {

    console.error(erreur);

    champNumero.value =
      "Erreur";

    afficherMessage(
      "❌ Impossible de générer le numéro de facture : " +
      erreur.message,
      "danger"
    );

  }

}
  document.addEventListener(
  "DOMContentLoaded",
  function() {

    mettreDateDuJour();

    ajouterPrestation();

    obtenirNumeroFacture();

  }
);

</script>


</body>
</html>
