<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facturation</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f5f6f8;
    }

    .navbar-brand {
      font-weight: 600;
    }

    .facture-card {
      transition: transform 0.15s ease;
    }

    .facture-card:hover {
      transform: translateY(-2px);
    }

    .montant {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .pdf-btn {
      white-space: nowrap;
    }

    #chargement {
      min-height: 150px;
    }

    .menu-item {
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-primary shadow-sm">

  <div class="container-fluid">

    <span class="navbar-brand">
      🧾 Facturation
    </span>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#menuPrincipal"
      aria-controls="menuPrincipal"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

  </div>

</nav>


<!-- =====================================================
     MENU SANDWICH
===================================================== -->

<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="menuPrincipal"
>

  <div class="offcanvas-header">

    <h5 class="offcanvas-title">
      🧾 Facturation
    </h5>

    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
    ></button>

  </div>


  <div class="offcanvas-body">

    <div class="list-group">

      <button
        class="list-group-item list-group-item-action menu-item"
        onclick="nouvelleFacture()"
        data-bs-dismiss="offcanvas"
      >
        ➕ Nouvelle facture
      </button>

      <button
        class="list-group-item list-group-item-action menu-item"
        onclick="chargerFactures()"
        data-bs-dismiss="offcanvas"
      >
        📋 Liste des factures
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     CONTENU PRINCIPAL
===================================================== -->

<main class="container py-4">

  <!-- TITRE -->

  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">

    <div>
      <h1 class="h3 mb-1">
        Factures enregistrées
      </h1>

      <p class="text-muted mb-0">
        Liste des factures disponibles
      </p>
    </div>


    <button
      class="btn btn-primary mt-3 mt-md-0"
      onclick="nouvelleFacture()"
    >
      ➕ Nouvelle facture
    </button>

  </div>


  <!-- RECHERCHE -->

  <div class="mb-4">

    <input
      type="search"
      id="recherche"
      class="form-control form-control-lg"
      placeholder="🔎 Rechercher une facture ou un client..."
      oninput="filtrerFactures()"
    >

  </div>


  <!-- CHARGEMENT -->

  <div
    id="chargement"
    class="d-flex justify-content-center align-items-center"
  >

    <div class="text-center">

      <div
        class="spinner-border text-primary"
        role="status"
      ></div>

      <div class="mt-2 text-muted">
        Chargement des factures...
      </div>

    </div>

  </div>


  <!-- MESSAGE ERREUR -->

  <div
    id="erreur"
    class="alert alert-danger d-none"
  ></div>


  <!-- LISTE -->

  <div
    id="listeFactures"
    class="row g-3"
  ></div>


  <!-- AUCUNE FACTURE -->

  <div
    id="aucuneFacture"
    class="alert alert-info text-center d-none"
  >
    Aucune facture trouvée.
  </div>

</main>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

  // =====================================================
  // URL APPS SCRIPT
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwt6v8LytyBwJx5B8bZRJ9nUkhHt_hj_wv_UmQwSWHdTpPn8ayRLcj4qq8dJZJbSePx/exec";


  // Tableau global
  let factures = [];


  // =====================================================
  // CHARGER LES FACTURES
  // =====================================================

  async function chargerFactures() {

    const chargement =
      document.getElementById("chargement");

    const erreur =
      document.getElementById("erreur");

    const liste =
      document.getElementById("listeFactures");

    const aucune =
      document.getElementById("aucuneFacture");


    chargement.classList.remove("d-none");

    erreur.classList.add("d-none");

    liste.innerHTML = "";

    aucune.classList.add("d-none");


    try {

      const response =
        await fetch(
          API_URL + "?page=listeFactures"
        );


      if (!response.ok) {
        throw new Error(
          "Erreur HTTP : " + response.status
        );
      }


      const data =
        await response.json();


      if (!data.succes) {

        throw new Error(
          data.erreur ||
          "Erreur lors du chargement."
        );

      }


      factures =
        data.factures || [];


      afficherFactures(factures);


    } catch (error) {

      console.error(error);

      erreur.textContent =
        "Impossible de charger les factures : " +
        error.message;

      erreur.classList.remove("d-none");

    } finally {

      chargement.classList.add("d-none");

    }

  }


  // =====================================================
  // AFFICHER LES FACTURES
  // =====================================================

  function afficherFactures(liste) {

    const conteneur =
      document.getElementById("listeFactures");

    const aucune =
      document.getElementById("aucuneFacture");


    conteneur.innerHTML = "";


    if (!liste.length) {

      aucune.classList.remove("d-none");

      return;

    }


    aucune.classList.add("d-none");


    liste.forEach(function(facture) {

      const col =
        document.createElement("div");

      col.className =
        "col-12 col-md-6 col-lg-4";


      const card =
        document.createElement("div");

      card.className =
        "card facture-card h-100 shadow-sm";


      const body =
        document.createElement("div");

      body.className =
        "card-body";


      // NUMERO

      const numero =
        document.createElement("h5");

      numero.className =
        "card-title mb-2";

      numero.textContent =
        facture.numero;


      // CLIENT

      const client =
        document.createElement("p");

      client.className =
        "mb-1";

      client.innerHTML =
        "<strong>Client :</strong> " +
        escapeHtml(facture.client);


      // DATE

      const date =
        document.createElement("p");

      date.className =
        "text-muted mb-2";

      date.innerHTML =
        "📅 " +
        escapeHtml(facture.date);


      // TOTAL

      const total =
        document.createElement("p");

      total.className =
        "montant mb-3";

      total.textContent =
        "Total : " +
        formaterMontant(facture.total);


      // BOUTON PDF

      let boutonPDF;


      if (facture.pdfUrl) {

        boutonPDF =
          document.createElement("a");

        boutonPDF.href =
          facture.pdfUrl;

        boutonPDF.target =
          "_blank";

        boutonPDF.rel =
          "noopener";

        boutonPDF.className =
          "btn btn-outline-primary pdf-btn";

        boutonPDF.textContent =
          "📄 Ouvrir le PDF";

      } else {

        boutonPDF =
          document.createElement("button");

        boutonPDF.disabled =
          true;

        boutonPDF.className =
          "btn btn-outline-secondary";

        boutonPDF.textContent =
          "📄 PDF non disponible";

      }


      body.appendChild(numero);

      body.appendChild(client);

      body.appendChild(date);

      body.appendChild(total);

      body.appendChild(boutonPDF);

      card.appendChild(body);

      col.appendChild(card);

      conteneur.appendChild(col);

    });

  }


  // =====================================================
  // RECHERCHE
  // =====================================================

  function filtrerFactures() {

    const recherche =
      document
        .getElementById("recherche")
        .value
        .toLowerCase()
        .trim();


    if (!recherche) {

      afficherFactures(factures);

      return;

    }


    const resultat =
      factures.filter(function(facture) {

        return (

          String(facture.numero)
            .toLowerCase()
            .includes(recherche)

          ||

          String(facture.client)
            .toLowerCase()
            .includes(recherche)

          ||

          String(facture.date)
            .toLowerCase()
            .includes(recherche)

        );

      });


    afficherFactures(resultat);

  }


  // =====================================================
  // FORMATAGE DU MONTANT
  // =====================================================

  function formaterMontant(montant) {

    return Number(montant || 0)
      .toLocaleString(
        "fr-FR"
      ) + " Ar";

  }


  // =====================================================
  // PROTECTION DU TEXTE HTML
  // =====================================================

  function escapeHtml(texte) {

    const div =
      document.createElement("div");

    div.textContent =
      texte || "";

    return div.innerHTML;

  }


  // =====================================================
  // NOUVELLE FACTURE
  // =====================================================

  function nouvelleFacture() {
  window.location.href = "formulaire.html";
}


  // =====================================================
  // CHARGEMENT AUTOMATIQUE
  // =====================================================

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      chargerFactures();

    }
  );

</script>

</body>
</html>
